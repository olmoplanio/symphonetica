name: Build Symphonetica Fonts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-fonts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fontforge python3-fontforge

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run FontForge build
        run: |
          mkdir -p build
          python3 devops/run_fontforge.py devops/build_fonts.py src assets

      - name: Log built fonts
        run: |
          mkdir -p bin
          python3 devops/log.py

      - name: Commit and push generated fonts
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add assets/fonts/* assets/*.nam
          git diff --staged --quiet || git commit -m "Build: Update generated fonts [skip ci]"
          git push
